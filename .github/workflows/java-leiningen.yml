name: leiningen
"on":
  merge_group:
  pull_request:
    paths:
    - java/leiningen/**
    - ".github/workflows/java-leiningen.yml"
  push:
    branches:
    - main
    paths:
    - java/leiningen/**

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - uses: actions/cache@v6
        with:
          path: ~/.lein
          key: ${{ runner.os }}-lein-${{ hashFiles('java/leiningen/project.clj') }}
          restore-keys: ${{ runner.os }}-lein
      - run: ./lein uberjar
        working-directory: java/leiningen
        env:
          LEIN_HOME: ~/.lein
